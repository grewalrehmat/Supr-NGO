services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: ${PACT_DB_USER:-pact}
      POSTGRES_PASSWORD: ${PACT_DB_PASSWORD:-pact-local}
    ports:
      - "5432:5432"
    volumes:
      - pact-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PACT_DB_USER:-pact} -d pact"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pact-postgres:
